name: nodeget-stack

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      nodeget-server:
        condition: service_started
      nodeget-statusshow:
        condition: service_started
      nodeget-board:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
      NODEGET_PORT: ${NODEGET_PORT:-2211}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nodeget}
      POSTGRES_USER: ${POSTGRES_USER:-nodeget}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nodeget} -d ${POSTGRES_DB:-nodeget}"]
      interval: 5s
      timeout: 5s
      retries: 20

  nodeget-server:
    image: ${NODEGET_IMAGE:-genshinmc/nodeget:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODEGET_PORT: ${NODEGET_PORT:-2211}
      NODEGET_LOG_FILTER: ${NODEGET_LOG_FILTER:-info}
      NODEGET_SERVER_UUID: ${NODEGET_SERVER_UUID:-}
      NODEGET_DATABASE_URL: postgres://${POSTGRES_USER:-nodeget}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nodeget}
    volumes:
      - nodeget-config:/etc/nodeget
      - nodeget-data:/var/lib/nodeget

  nodeget-statusshow:
    build:
      context: ./statusshow
      args:
        STATUSSHOW_REPO: ${STATUSSHOW_REPO:-https://github.com/eeviriyi/NodeGet-StatusShow.git}
        STATUSSHOW_REF: ${STATUSSHOW_REF:-main}
    restart: unless-stopped
    volumes:
      - ./statusshow/config.json:/usr/share/nginx/html/config.json:ro

  nodeget-board:
    build:
      context: ./board
      args:
        BOARD_REPO: ${BOARD_REPO:-https://github.com/eeviriyi/NodeGet-board.git}
        BOARD_REF: ${BOARD_REF:-main}
        BOARD_BASE: /board/
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  nodeget-config:
  nodeget-data:
